name: Kaizen
description: 'Kaizen Labs is a New York City civic-technology company building a modular platform
  that helps local, state, and federal government agencies serve constituents simply, securely, and
  at scale. Founded in 2022 by Nikhil Reddy and Kj Shah, the platform spans permitting and licensing,
  recreation reservations and registrations, parking management, tolls and transit fare collection,
  e-billing and tax payments, DMV and judicial-court services, and AI-assisted case management —
  reaching roughly 40 million residents across 50+ agencies in 17 states. Kaizen has raised about
  $35M from NEA, Andreessen Horowitz, Accel, 776, and Carpenter Capital. The company publishes no
  public developer API surface; this profile is enriched from its public website, llms.txt, and
  security & compliance disclosures.'
